name: Checks

on:
  pull_request:
    branches: [ main, dev ]
    paths: 
      - 'packages/**'
  push:
    branches: [ main, dev ]
    paths: 
      - 'packages/**'

jobs:
  lint:
    if: github.actor != 'RastGame'
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.12.4
        
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
      
    - name: Lint
      run: pnpm run lint

  test:
    if: github.actor != 'RastGame'
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
        
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
      
    - name: Build packages
      run: pnpm run build
      
    - name: Run tests
      run: pnpm run test

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    if: github.actor != 'RastGame'
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
        
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
      
    - name: Build packages
      run: pnpm run build